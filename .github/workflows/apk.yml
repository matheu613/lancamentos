name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/apk.yml"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar Capacitor e criar o projeto Android
        run: |
          npm install
          npx cap add android

      - name: Gerar ícones do app
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#b4441f' --iconBackgroundColorDark '#b4441f'

      - name: Versão, permissão de notificação e assinatura
        run: |
          cd android/app
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" build.gradle
          grep -q POST_NOTIFICATIONS src/main/AndroidManifest.xml || \
            sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' src/main/AndroidManifest.xml
          # Mesma chave em toda geração, para o Android aceitar a versão nova por cima da antiga.
          cat >> build.gradle <<'EOF'

          android {
              signingConfigs {
                  debug {
                      storeFile file('../../assinatura.p12')
                      storeType 'pkcs12'
                      storePassword 'lancamentos'
                      keyAlias 'lancamentos'
                      keyPassword 'lancamentos'
                  }
              }
          }
          EOF
          grep -n "versionCode\|versionName" build.gradle

      - name: Compilar o APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../lancamentos.apk

      - name: Publicar na página de Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.${{ github.run_number }}" lancamentos.apk \
            --title "Lançamentos 1.${{ github.run_number }} (Android)" \
            --notes "Baixe lancamentos.apk no celular Android e abra para instalar. Pode ser preciso permitir a instalação de apps desta fonte."
